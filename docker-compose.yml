version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kids-theater-web
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - kids-theater-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  kids-theater-net:
    driver: bridge
